name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject tracked AI tool backups
        shell: bash
        run: |
          mapfile -t tracked_files < <(
            git ls-files -- \
              '.devcontainer/shared/scripts/ai-tool-data-backup.tar.gz' \
              '.devcontainer/shared/scripts/.ai-tool-data-backup.tar.gz.tmp.*'
          )

          if (( ${#tracked_files[@]} > 0 )); then
            for path in "${tracked_files[@]}"; do
              echo "::error file=${path}::This AI tool backup file must not be tracked by Git."
            done
            exit 1
          fi

      - name: Install Gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail --location --silent --show-error \
            "${download_url}" \
            --output "/tmp/${archive}"

          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/${archive}" | sha256sum --check
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          sudo install --mode 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan complete Git history
        run: gitleaks git --redact --no-banner .
