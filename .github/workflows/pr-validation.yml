name: PR Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a PR branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Select the PR branch when running this workflow."
          exit 1

      - name: Prepare Docker Compose validation environments
        run: |
          mkdir -p .ci-project

          for environment in default wp683; do
            cp "environments/${environment}.env.example" "environments/${environment}.env"
            sed -i \
              -e 's#<plugins|themes>#plugins#g' \
              -e 's#<your-plugin-slug-name|your-theme-slug-name>#example-plugin#g' \
              -e 's#../../<your-project-source-path>#../../.ci-project#g' \
              -e 's#<your-repository-name>#example-plugin#g' \
              "environments/${environment}.env"
          done

      - name: Validate default Docker Compose configuration
        run: docker compose -f .devcontainer/default/compose.yaml config --quiet

      - name: Validate WordPress 6.8.3 Docker Compose configuration
        run: docker compose -f .devcontainer/wp683/compose.yaml config --quiet

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD
