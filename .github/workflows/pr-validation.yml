name: PR Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a PR branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Select the PR branch when running this workflow."
          exit 1

      - name: Prepare Docker Compose validation environment
        run: |
          mkdir -p .ci-project

          cat > environments/.env <<'EOF'
          PROJECT_NAME=wp-dev-ci
          WORDPRESS_DB_NAME=wordpress
          WORDPRESS_DB_USER=wordpress
          WORDPRESS_DB_PASSWORD=wordpress
          WORDPRESS_DB_ROOT_PASSWORD=wordpress-root
          WORDPRESS_ADMIN_USER=admin
          WORDPRESS_ADMIN_PASSWORD=admin
          WORDPRESS_ADMIN_EMAIL=admin@example.test
          LOCAL_UID=1000
          LOCAL_GID=1000
          TZ=Asia/Tokyo
          LOCALE=ja_JP.UTF-8
          WP_PROJECT_DIRECTORY=plugins
          WP_PROJECT_SLUG=example-plugin
          WP_PROJECT_SOURCE_PATH=../../.ci-project
          WORKSPACE_NAME=example-plugin
          EOF

      - name: Validate default Docker Compose configuration
        run: docker compose -f .devcontainer/default/compose.yaml config --quiet

      - name: Validate WordPress 6.8.3 Docker Compose configuration
        run: docker compose -f .devcontainer/wp683/compose.yaml config --quiet

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD
