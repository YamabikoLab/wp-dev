name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  wordpress:
    build:
      context: ..
      dockerfile: .devcontainer/shared/docker/Dockerfile
      args:
        COMPOSER_VERSION: ${COMPOSER_VERSION:?COMPOSER_VERSION is required}
        WORDPRESS_IMAGE_TAG: ${WORDPRESS_IMAGE_TAG:?WORDPRESS_IMAGE_TAG is required}
        NODE_VERSION: ${NODE_VERSION:?NODE_VERSION is required}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?PLAYWRIGHT_VERSION is required}
        PLAYWRIGHT_ONLY_SHELL: ${PLAYWRIGHT_ONLY_SHELL:-false}
        WP_CLI_VERSION: ${WP_CLI_VERSION:?WP_CLI_VERSION is required}
        XDEBUG_VERSION: ${XDEBUG_VERSION:?XDEBUG_VERSION is required}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?CODEX_CLI_VERSION is required}
        LOGCUT_VERSION: ${LOGCUT_VERSION:?LOGCUT_VERSION is required}
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
        LOCALE: ${LOCALE:-ja_JP.UTF-8}
        TZ: ${TZ:-Asia/Tokyo}
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      LANG: ${LOCALE:-ja_JP.UTF-8}
      WORDPRESS_HOST: ${WORDPRESS_HOST:-127.0.0.1}
      WORDPRESS_PORT: ${WORDPRESS_PORT:?WORDPRESS_PORT is required}
      WORDPRESS_URL: http://${WORDPRESS_HOST:-127.0.0.1}:${WORDPRESS_PORT:?WORDPRESS_PORT is required}
      WP_BASE_URL: http://${WORDPRESS_HOST:-127.0.0.1}:${WORDPRESS_PORT:?WORDPRESS_PORT is required}
      WP_USERNAME: ${WORDPRESS_ADMIN_USER:-admin}
      WP_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-admin}
      WORDPRESS_DEBUG: "1"

      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);

        // wp-dev: canonical-url
        if (!defined('WP_HOME')) {
            define('WP_HOME', getenv('WORDPRESS_URL'));
        }
        if (!defined('WP_SITEURL')) {
            define('WP_SITEURL', getenv('WORDPRESS_URL'));
        }
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:?WORDPRESS_PORT is required}:80"
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html

      - type: bind
        source: ${WP_PROJECT_SOURCE_PATH:?WP_PROJECT_SOURCE_PATH is required}
        target: /var/www/html/wp-content/${WP_PROJECT_DIRECTORY}/${WP_PROJECT_SLUG}
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ${WP_PROJECT_SOURCE_PATH:?WP_PROJECT_SOURCE_PATH is required}
        target: /workspaces/project
        bind:
          create_host_path: false

      - type: bind
        source: ..
        target: /workspaces/wp-dev
        bind:
          create_host_path: false

      - type: bind
        source: ../docker/mail/msmtprc
        target: /etc/msmtprc
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ../.devcontainer/shared/php/xdebug.ini
        target: /usr/local/etc/php/conf.d/99-xdebug.ini
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ../.devcontainer/shared/php/php.ini
        target: /usr/local/etc/php/conf.d/zz-development.ini
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-wordpress-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  wordpress_data:
  db_data:
